<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<title>狼人殺 · 線上版</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
:root{
  --bg:#0b0e14; --panel:#151a24; --panel-2:#1c2230; --line:#2a3345;
  --text:#e6ecf5; --muted:#8b98ad; --good:#4ade80; --wolf:#f87171;
  --accent:#7c9cff; --gold:#f5c451; --doctor:#22d3ee; --sniper:#f472b6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  background:radial-gradient(1200px 800px at 50% -10%,#1b2436 0%,var(--bg) 60%);
  color:var(--text);font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  min-height:100vh;
}
body{display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;transition:.15s;touch-action:manipulation}
button:disabled{opacity:.45;cursor:not-allowed}
input{font-family:inherit}

.lobby{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.lobby-card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.lobby-card h1{font-size:26px;letter-spacing:4px;text-align:center;margin-bottom:8px;
  background:linear-gradient(90deg,#7c9cff,#f5c451);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:28px;letter-spacing:1px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:1px}
.field input{width:100%;padding:12px 14px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;color:var(--text);font-size:16px;outline:none;transition:.15s;}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,156,255,.15)}
.btn{width:100%;padding:14px;font-size:15px;font-weight:600;letter-spacing:1px;color:#fff;
  background:linear-gradient(135deg,#4a6bff,#7c9cff);}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--text)}
.btn.wolf{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.btn.good{background:linear-gradient(135deg,#15803d,#4ade80)}
.btn.gold{background:linear-gradient(135deg,#b8860b,#f5c451);color:#241a00}
.btn.doctor{background:linear-gradient(135deg,#0891b2,#22d3ee)}
.btn.sniper{background:linear-gradient(135deg,#be185d,#f472b6)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.7}
.err{color:var(--wolf);font-size:13px;text-align:center;margin-top:12px;min-height:18px}

.room{padding:24px;flex:1;overflow-y:auto}
.room-head{display:flex;justify-content:space-between;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 22px;margin-bottom:20px;
  gap:12px;flex-wrap:wrap;}
.room-code{font-size:12px;color:var(--muted);letter-spacing:2px}
.room-code b{color:var(--gold);font-size:22px;letter-spacing:6px;display:block;margin-top:4px}
.players-wait{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pw{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;font-size:14px;}
.pw .dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}
.pw.host{border-color:var(--gold)}
.pw.ai{border-color:var(--accent)}
.pw .tag{font-size:11px;color:var(--gold);display:block;margin-top:6px;letter-spacing:1px}
.pw .tag.ai{color:var(--accent)}

.board{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px;overflow:hidden}
.statusbar{display:flex;align-items:center;gap:20px;padding:14px 22px;
  background:linear-gradient(90deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:14px;flex-wrap:wrap;}
.phase-badge{padding:6px 16px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:1px;
  background:rgba(124,156,255,.15);color:var(--accent);border:1px solid rgba(124,156,255,.3);white-space:nowrap;}
.phase-badge.night{background:rgba(88,101,242,.15);color:#93a5ff;border-color:rgba(88,101,242,.4)}
.phase-badge.day{background:rgba(245,196,81,.15);color:var(--gold);border-color:rgba(245,196,81,.4)}
.sb-title{font-size:16px;font-weight:600;letter-spacing:1px}
.sb-sub{font-size:12px;color:var(--muted);margin-top:3px}
.timer{margin-left:auto;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--accent);min-width:64px;text-align:right}
.myrole{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);font-size:13px;}
.myrole .rname{font-weight:700;letter-spacing:1px}
.myrole.good .rname{color:var(--good)}
.myrole.wolf .rname{color:var(--wolf)}
.myrole.doctor .rname{color:var(--doctor)}
.myrole.sniper .rname{color:var(--sniper)}

.main{flex:1;display:flex;gap:12px;min-height:0;flex-wrap:wrap}
.grid-wrap{flex:1;min-width:280px;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.pcard{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:14px;
  padding:14px 8px;text-align:center;transition:.18s;}
.pcard .avatar{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;
  background:linear-gradient(135deg,#3b4a6b,#2a3345);color:#cfd8e8;}
.pcard .pname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pmeta{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.5px;min-height:13px}
.pcard.dead{opacity:.32;filter:grayscale(1)}
.pcard.dead::after{content:'☠';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:40px;color:#ff6b6b;opacity:.85;}
.pcard.me{border-color:var(--accent)}
.pcard.me .pname::after{content:' (你)';color:var(--accent);font-size:11px}
.pcard.selectable{cursor:pointer;border-color:rgba(245,196,81,.5)}
.pcard.selectable:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 20px rgba(245,196,81,.15)}
.pcard.selected{border-color:var(--gold);background:rgba(245,196,81,.09)}
.pcard .votebadge{position:absolute;top:6px;right:6px;background:var(--gold);color:#241a00;
  border-radius:99px;padding:1px 7px;font-size:11px;font-weight:800;}
.pcard .needlebadge{position:absolute;top:6px;right:6px;background:var(--doctor);color:#082f49;
  border-radius:99px;padding:1px 7px;font-size:10px;font-weight:800;}

.sidebar{width:290px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column}
.action-panel .title{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--gold)}
.action-panel .desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.action-panel .btns{display:flex;flex-direction:column;gap:8px}
.action-panel .btns .btn{padding:12px;font-size:14px}
.shoot-info{font-size:11.5px;color:var(--muted);background:var(--panel-2);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.6;}

.chat{flex:1;min-height:200px}
.chat-tabs{display:flex;gap:6px;margin-bottom:10px}
.chat-tab{flex:1;padding:8px 4px;font-size:11px;border-radius:8px;background:var(--panel-2);
  color:var(--muted);border:1px solid transparent;letter-spacing:.5px;}
.chat-tab.active{background:rgba(124,156,255,.15);color:var(--accent);border-color:rgba(124,156,255,.35)}
.chat-tab.wolf.active{background:rgba(239,68,68,.15);color:var(--wolf);border-color:rgba(239,68,68,.4)}
.chat-tab.evil.active{background:rgba(244,114,182,.15);color:var(--sniper);border-color:rgba(244,114,182,.4)}
.chat-tab.police.active{background:rgba(34,211,238,.15);color:var(--doctor);border-color:rgba(34,211,238,.4)}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:12.5px;min-height:80px}
.msg{line-height:1.5;word-break:break-word}
.msg .who{font-weight:700;margin-right:6px;color:var(--accent)}
.msg.system{color:var(--muted);font-style:italic;font-size:11.5px}
.chat-input{display:flex;gap:6px;margin-top:10px}
.chat-input input{flex:1;padding:11px 12px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;color:var(--text);font-size:15px;outline:none;}
.chat-input button{padding:0 16px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}

.judge-bar{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,rgba(21,26,36,.97),rgba(28,34,48,.97));
  border:1px solid var(--gold);border-radius:14px;padding:14px 28px;
  font-size:15px;letter-spacing:1px;color:var(--gold);z-index:90;
  box-shadow:0 12px 40px rgba(245,196,81,.18);
  max-width:80vw;text-align:center;animation:slideUp .3s ease;}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,14px)}}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#2f3a4f;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

@media(max-width:900px){
  .main{flex-direction:column}
  .sidebar{width:100%}
}
@media(max-width:768px){
  body{overflow:auto;min-height:100vh}
  #app{min-height:100vh;height:auto}
  .lobby{padding:16px;align-items:flex-start;padding-top:40px}
  .lobby-card{padding:28px 22px;border-radius:16px}
  .lobby-card h1{font-size:22px}
  .sub{font-size:11px;margin-bottom:22px}
  .room{padding:12px}
  .room-head{flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px;border-radius:12px}
  .room-head > div:first-child{text-align:center}
  .room-code b{font-size:20px;letter-spacing:4px}
  .room-head > div:last-child{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .room-head .btn{padding:9px 14px !important;font-size:13px !important}
  .players-wait{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .pw{padding:12px 6px;font-size:12px;border-radius:10px}
  .pw .tag{font-size:10px;margin-top:4px}
  .board{padding:8px;gap:8px;overflow:visible;height:auto}
  .statusbar{padding:10px 12px;gap:8px;border-radius:12px}
  .phase-badge{padding:4px 10px;font-size:11px}
  .sb-title{font-size:13px;letter-spacing:0}
  .sb-sub{font-size:10.5px;line-height:1.4}
  .timer{font-size:22px;min-width:40px}
  .myrole{padding:5px 10px;font-size:11px}
  .myrole .rname{font-size:12px}
  .main{flex-direction:column;gap:10px;min-height:auto}
  .grid-wrap{overflow:visible;min-width:0;width:100%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .pcard{padding:10px 5px;border-radius:12px}
  .pcard .avatar{width:36px;height:36px;font-size:15px;margin-bottom:5px}
  .pcard .pname{font-size:11.5px}
  .pcard .pmeta{font-size:9.5px}
  .pcard.dead::after{font-size:32px}
  .pcard.me .pname::after{font-size:9px}
  .sidebar{width:100%;gap:10px}
  .panel{padding:12px;border-radius:12px}
  .action-panel .title{font-size:13px}
  .action-panel .desc{font-size:11.5px;line-height:1.5}
  .action-panel .btns{gap:6px}
  .action-panel .btns .btn{padding:13px;font-size:14px}
  .chat{min-height:240px}
  .chat-tabs{gap:5px;margin-bottom:8px}
  .chat-tab{padding:8px 4px;font-size:11px}
  .chat-msgs{min-height:100px;max-height:180px;font-size:12px}
  .judge-bar{bottom:12px;padding:10px 18px;font-size:13px;max-width:92vw;border-radius:12px}
}
@media(max-width:400px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
  .pcard{padding:8px 4px}
  .pcard .avatar{width:32px;height:32px;font-size:14px}
  .pcard .pname{font-size:11px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const SERVER_URL = 'https://werewolf-server-jmaa.onrender.com';
const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });

const ROLE_INFO = {
  WEREWOLF: { name:'狼人',   camp:'wolf',   desc:'每晚與同伴共同商議刺殺一名玩家。', icon:'🐺' },
  SNIPER:   { name:'狙擊手', camp:'sniper', desc:'邪惡方。每晚可狙擊1人（不能狙自己），子彈威力醫生無法救治。你可能誤殺狼人！', icon:'🎯' },
  SEER:     { name:'警察',   camp:'good',   desc:'每晚可查驗一名玩家的陣營（好人 / 壞人）。', icon:'🔮' },
  DOCTOR:   { name:'醫生',   camp:'doctor', desc:'每晚可對1人施針（包含自己）。若目標被狼人殺 → 救活；累計2次空針 → 目標死亡。', icon:'💉' },
  VILLAGER: { name:'平民',   camp:'good',   desc:'沒有夜間技能，白天靠推理與投票找出邪惡方。', icon:'👤' },
};

let state = {
  screen: 'lobby', roomId: null, myId: null, players: [], isHost: false,
  phase: 'LOBBY', day: 0, myRole: null, phaseData: {}, selectedTarget: null,
  myVote: null, chats: { PUBLIC: [], WOLF: [], EVIL: [], DEAD: [] },
  chatTab: 'PUBLIC', gameOver: null, endsAt: null,
  doctorShotsLeft: 0, sniperShotsLeft: 0,
  teammateVotes: {},
};

const app = document.getElementById('app');

function render(){
  app.innerHTML = '';
  if(state.screen === 'lobby')      app.appendChild(LobbyView());
  else if(state.screen === 'room')  app.appendChild(RoomView());
  else                              app.appendChild(BoardView());
  if(state.gameOver) app.appendChild(GameOverModal());
}

function leaveRoom(){
  socket.emit('leave_room');
  state.screen = 'lobby'; state.roomId = null; state.players = [];
  state.isHost = false; state.phase = 'LOBBY'; state.myRole = null;
  state.gameOver = null; state.selectedTarget = null; state.myVote = null;
  state.phaseData = {}; state.chats = { PUBLIC: [], WOLF: [], EVIL: [], DEAD: [] };
  state.teammateVotes = {};
  render();
}

function LobbyView(){
  const el = document.createElement('div');
  el.className = 'lobby';
  el.innerHTML = `
    <div class="lobby-card">
      <h1>狼 人 殺</h1>
      <div class="sub">6–18 人 · 醫生 + 狙擊手 · AI 讀聊天</div>
      <div class="field">
        <label>你的暱稱</label>
        <input id="nick" maxlength="12" placeholder="輸入暱稱…" autocomplete="off" />
      </div>
      <button class="btn" id="btn-create">建立房間</button>
      <div class="field" style="margin-top:16px">
        <label>房間邀請碼</label>
        <input id="roomcode" maxlength="6" placeholder="6 碼房間號" style="text-transform:uppercase;letter-spacing:4px;text-align:center" autocomplete="off" />
      </div>
      <button class="btn ghost" id="btn-join">加入房間</button>
      <div class="err" id="lobby-err"></div>
      <div class="hint">💡 人不夠？進房後可新增 AI 玩家補位</div>
    </div>
  `;
  const err = m => el.querySelector('#lobby-err').textContent = m;
  el.querySelector('#btn-create').onclick = () => {
    const nickname = el.querySelector('#nick').value.trim();
    if(!nickname) return err('請輸入暱稱');
    socket.emit('create_room', { nickname, roomIdLength: 6 }, res => {
      if(!res?.ok) err(res?.error || '建立失敗');
    });
  };
  el.querySelector('#btn-join').onclick = () => {
    const nickname = el.querySelector('#nick').value.trim();
    const roomId = el.querySelector('#roomcode').value.trim().toUpperCase();
    if(!nickname) return err('請輸入暱稱');
    if(!roomId) return err('請輸入房間號');
    socket.emit('join_room', { nickname, roomId }, res => {
      if(!res?.ok) err(res?.error || '加入失敗');
    });
  };
  return el;
}

function RoomView(){
  const aiCount = state.players.filter(p => p.isAI).length;
  const n = state.players.length;
  const el = document.createElement('div');
  el.className = 'room';

  let compStr = '';
  if(n >= 6){
    if(n <= 8) compStr = '1 狼 + 1 警';
    else if(n <= 11) compStr = '2 狼 + 2 警';
    else if(n <= 14) compStr = '3 狼 + 3 警 + 1 醫(3針) + 1 狙(3彈)';
    else compStr = '4 狼 + 4 警 + 1 醫(4針) + 1 狙(4彈)';
  }

  el.innerHTML = `
    <div class="room-head">
      <div><div class="room-code">房間邀請碼<b>${state.roomId || ''}</b></div></div>
      <div>
        <span style="font-size:13px;color:var(--muted);align-self:center;margin-right:4px">${n} / 18 人</span>
        <button class="btn ghost" id="btn-copy" style="width:auto;padding:9px 16px">複製邀請碼</button>
        <button class="btn ghost" id="btn-leave" style="width:auto;padding:9px 16px">離開</button>
      </div>
    </div>
    ${compStr ? `<div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin-bottom:16px;font-size:13px;color:var(--muted)">
      📋 目前配置：<b style="color:var(--gold)">${compStr}</b>（其餘平民）
    </div>` : ''}
    <div class="players-wait">
      ${state.players.map(p => `
        <div class="pw ${p.isHost?'host':''} ${p.isAI?'ai':''}">
          <div><span class="dot"></span>${p.name}</div>
          ${p.isHost?'<span class="tag">房主</span>':''}
          ${p.isAI?'<span class="tag ai">🤖 AI</span>':''}
        </div>
      `).join('')}
    </div>
    <div style="margin-top:28px;max-width:420px">
      ${state.isHost ? `
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="btn ghost" id="btn-add-ai" ${n>=18?'disabled':''}>＋ 新增 AI 玩家</button>
          ${aiCount > 0 ? `<button class="btn ghost" id="btn-remove-ai" style="flex:0 0 auto;width:auto;padding:13px 18px">移除 AI</button>` : ''}
        </div>
        <button class="btn gold" id="btn-start" ${n<6?'disabled':''}>
          開始遊戲 ${n<6?`（還需 ${6-n} 人）`:''}
        </button>
      ` : `<div class="hint">等待房主開始遊戲…</div>`}
    </div>
  `;

  el.querySelector('#btn-copy')?.addEventListener('click', () => {
    navigator.clipboard?.writeText(state.roomId);
    alert('邀請碼已複製：' + state.roomId);
  });
  el.querySelector('#btn-leave')?.addEventListener('click', () => {
    if(!confirm('確定要離開房間嗎？')) return;
    leaveRoom();
  });
  el.querySelector('#btn-add-ai')?.addEventListener('click', () => {
    socket.emit('add_ai_player', {}, res => { if(!res?.ok) alert(res?.error || '新增 AI 失敗'); });
  });
  el.querySelector('#btn-remove-ai')?.addEventListener('click', () => {
    const aiPlayers = state.players.filter(p => p.isAI);
    if(!aiPlayers.length) return;
    socket.emit('remove_ai_player', { playerId: aiPlayers[aiPlayers.length - 1].id }, res => {
      if(!res?.ok) alert(res?.error || '移除 AI 失敗');
    });
  });
  el.querySelector('#btn-start')?.addEventListener('click', () => {
    socket.emit('start_game', {}, res => { if(!res?.ok) alert(res?.error || '無法開始'); });
  });
  return el;
}

function BoardView(){
  const me = state.players.find(p => p.id === state.myId);
  const isNight = state.phase.startsWith('NIGHT');
  const roleInfo = state.myRole ? ROLE_INFO[state.myRole] : null;

  const el = document.createElement('div');
  el.className = 'board';
  el.innerHTML = `
    <div class="statusbar">
      <div class="phase-badge ${isNight?'night':'day'}">${phaseLabel(state.phase)}</div>
      <div style="flex:1;min-width:0">
        <div class="sb-title">${phaseTitle(state.phase)}</div>
        <div class="sb-sub">${phaseSub(state.phase)}</div>
      </div>
      ${roleInfo ? `<div class="myrole ${roleInfo.camp}">
        <span style="color:var(--muted);font-size:10px">身分</span>
        <span class="rname">${roleInfo.icon} ${roleInfo.name}</span>
      </div>` : ''}
      <div class="timer" id="timer">--</div>
      <button class="btn ghost" id="btn-exit-game" style="width:auto;padding:8px 12px;font-size:12px">離開</button>
    </div>

    <div class="main">
      <div class="grid-wrap">
        <div class="grid">
          ${state.players.map(p => playerCard(p)).join('')}
        </div>
      </div>

      <div class="sidebar">
        <div class="panel action-panel">${ActionPanelHTML()}</div>
        <div class="panel chat">
          <div class="chat-tabs">
            <button class="chat-tab ${state.chatTab==='PUBLIC'?'active':''}" data-tab="PUBLIC">🌐 公開</button>
            ${state.myRole==='WEREWOLF' ? `<button class="chat-tab wolf ${state.chatTab==='WOLF'?'active':''}" data-tab="WOLF">🐺 狼隊</button>`:''}
                        ${state.myRole==='SNIPER' ? `<button class="chat-tab evil ${state.chatTab==='EVIL'?'active':''}" data-tab="EVIL">🎯 邪惡</button>`:''}
            ${state.myRole==='SEER' ? `<button class="chat-tab police ${state.chatTab==='POLICE'?'active':''}" data-tab="POLICE">🔮 警察</button>`:''}
            ${!me?.alive ? `<button class="chat-tab ${state.chatTab==='DEAD'?'active':''}" data-tab="DEAD">💀 亡者</button>`:''}
          </div>
          <div class="chat-msgs">
            ${(state.chats[state.chatTab] || []).map(chatMsgHTML).join('')}
          </div>
          <div class="chat-input">
            <input id="chat-in" placeholder="輸入訊息…" maxlength="120" autocomplete="off" />
            <button id="chat-send">送出</button>
          </div>
        </div>
      </div>
    </div>
  `;

  el.querySelector('.grid').addEventListener('click', e => {
    const card = e.target.closest('.pcard.selectable');
    if(!card) return;
    const pid = card.dataset.pid;
    state.selectedTarget = (state.selectedTarget === pid) ? null : pid;
    render();
  });

  el.querySelectorAll('.chat-tab').forEach(t => {
    t.onclick = () => { state.chatTab = t.dataset.tab; render(); };
  });

  const chatIn = el.querySelector('#chat-in');
  const sendChat = () => {
    const text = chatIn.value.trim();
    if(!text) return;
    socket.emit('chat_send', { channel: state.chatTab, text });
    chatIn.value = '';
  };
  el.querySelector('#chat-send').onclick = sendChat;
  chatIn.addEventListener('keydown', e => { if(e.key === 'Enter') sendChat(); });

  el.querySelector('#btn-exit-game')?.addEventListener('click', () => {
    if(!confirm('確定要離開遊戲嗎？')) return;
    leaveRoom();
  });

  bindActionButtons(el);
    // 🔑 聊天框自動滾到最新訊息
  setTimeout(() => {
    const box = el.querySelector('.chat-msgs');
    if (box) box.scrollTop = box.scrollHeight;
  }, 0);
  startTimer(el.querySelector('#timer'));
  return el;
}

function phaseLabel(p){
  const m = { LOBBY:'等待中', NIGHT_WOLF:'夜晚', NIGHT_SEER:'夜晚', NIGHT_DOCTOR:'夜晚', NIGHT_SNIPER:'夜晚',
    DAY_ANNOUNCE:'白天', DAY_DISCUSS:'白天', DAY_VOTE:'投票', GAME_OVER:'結算' };
  return m[p] || p;
}
function phaseTitle(p){
  const m = {
    LOBBY:'等待房主開始',
    NIGHT_WOLF:`第 ${state.day} 夜 · 狼人請睜眼`,
    NIGHT_SEER:`第 ${state.day} 夜 · 警察請睜眼`,
    NIGHT_DOCTOR:`第 ${state.day} 夜 · 醫生請睜眼`,
    NIGHT_SNIPER:`第 ${state.day} 夜 · 狙擊手請睜眼`,
    DAY_ANNOUNCE:`第 ${state.day} 天 · 天亮了`,
    DAY_DISCUSS:`第 ${state.day} 天 · 輪流發言`,
    DAY_VOTE:`第 ${state.day} 天 · 投票放逐`,
    GAME_OVER:'遊戲結束',
  };
  return m[p] || p;
}
function phaseSub(p){
  const m = {
    NIGHT_WOLF:'狼人之間可討論，選定今晚的目標',
    NIGHT_SEER:'選擇一名玩家查驗陣營',
    NIGHT_DOCTOR:'選擇一名玩家施針（可選自己）',
    NIGHT_SNIPER:'選擇一名玩家狙擊（不能選自己）',
    DAY_ANNOUNCE:'昨晚有人倒牌…',
    DAY_DISCUSS:'依序發言，找出潛藏的邪惡方',
    DAY_VOTE:'點擊玩家頭像投票，最高票者出局',
    GAME_OVER:'本局已結束',
  };
  return m[p] || '';
}

function playerCard(p){
  const isSelectable = state.phaseData?.selectableIds?.includes(p.id);
  const isSelected = state.selectedTarget === p.id;
  const isMe = p.id === state.myId;
  const voteCount = state.phaseData?.votes?.[p.id] || 0;
  const checkMark = state.phaseData?.checks?.[p.id];
  const emptyCount = state.phaseData?.emptyCounts?.[p.id] || 0;

  return `
    <div class="pcard ${p.alive?'':'dead'} ${isMe?'me':''} ${isSelectable?'selectable':''} ${isSelected?'selected':''}"
         data-pid="${p.id}">
      ${voteCount ? `<span class="votebadge">${voteCount}</span>` : ''}
      ${emptyCount ? `<span class="needlebadge">💉${emptyCount}</span>` : ''}
      ${checkMark ? `<span class="votebadge" style="right:auto;left:6px;background:${checkMark==='WOLF'?'var(--wolf)':'var(--good)'}">${checkMark==='WOLF'?'🐺':'✅'}</span>` : ''}
      <div class="avatar">${p.isAI?'🤖':p.name.slice(0,1).toUpperCase()}</div>
      <div class="pname">${p.name}</div>
      <div class="pmeta">${!p.alive ? '已出局' : p.isHost ? '房主' : p.isAI ? '🤖 AI' : ''}</div>
    </div>
  `;
}

function ActionPanelHTML(){
  const d = state.phaseData || {};
  const me = state.players.find(p => p.id === state.myId);
  if(state.phase === 'GAME_OVER') return `<div class="desc">遊戲已結束</div>`;
  if(!me?.alive) return `<div class="desc">💀 你已出局<br/>可繼續在亡者頻道觀戰</div>`;

  let teammatePanel = '';
  if(d.teammateVotes && Object.keys(d.teammateVotes).length){
    const rows = Object.entries(d.teammateVotes)
      .map(([id, v]) => `<div style="display:flex;justify-content:space-between;padding:3px 0"><span>${v.name}</span><span style="color:var(--gold)">→ ${v.targetName}</span></div>`)
      .join('');
    teammatePanel = `<div class="shoot-info">👥 同陣營投票：<br/>${rows}</div>`;
  }

  switch(state.phase){
    case 'NIGHT_WOLF': {
      if(state.myRole !== 'WEREWOLF') return `<div class="desc">🌙 天黑請閉眼…</div>`;
      const partner = (d.wolfPartners || []).map(p => p.name).join('、');
      return `
        <div class="title">🐺 狼人行動</div>
        <div class="desc">同伴：${partner || '（無）'}</div>
        ${teammatePanel}
        <div class="btns">
          <button class="btn wolf" data-action="wolf_confirm" ${state.selectedTarget?'':'disabled'}>
            ${state.selectedTarget ? '確認刺殺 ' + nameOf(state.selectedTarget) : '請先選擇目標'}
          </button>
        </div>`;
    }
        case 'NIGHT_SEER': {
      if(state.myRole !== 'SEER') return `<div class="desc">🌙 天黑請閉眼…</div>`;
      const checks = d.checks || {};
      const checkedList = Object.entries(checks).map(([id,c]) => `${nameOf(id)}：${c==='WOLF'?'🐺 壞人':'✅ 好人'}`).join('<br/>');
      const myVote = d.mySeerVote;
      const mateVotes = d.seerTeammateVotes || {};
      const matesCount = d.seerMatesCount || 0;
      const votedCount = d.seerVotedCount || 0;
      const totalSeers = matesCount + 1;

      // 同伴投票面板
      let matePanel = '';
      if (matesCount > 0 && Object.keys(mateVotes).length > 0) {
        const rows = Object.entries(mateVotes)
          .map(([id, v]) => `<div style="display:flex;justify-content:space-between;padding:3px 0"><span>${v.name}</span><span style="color:var(--doctor)">→ ${v.targetName}</span></div>`)
          .join('');
        matePanel = `<div class="shoot-info">🔮 同伴投票：<br/>${rows}</div>`;
      }

      // 已投過票 → 顯示等待狀態
      if (myVote) {
        const mateInfo = matesCount > 0
          ? `<div class="desc">已投票 ${votedCount}/${totalSeers} 位警察</div>`
          : `<div class="desc">已送出查驗，等待結果…</div>`;
        return `
          <div class="title">🔮 警察查驗</div>
          <div class="desc">✅ 你已投票給 <b style="color:var(--doctor)">${nameOf(myVote)}</b></div>
          ${matePanel}
          ${mateInfo}`;
      }

      return `
        <div class="title">🔮 警察查驗</div>
        <div class="desc">${matesCount > 0 ? `點擊玩家頭像投票，所有警察共同決定查驗對象（${totalSeers} 位警察）。` : '點擊玩家頭像查驗陣營。'}</div>
        ${matePanel}
        ${checkedList ? `<div class="desc" style="border-top:1px solid var(--line);padding-top:8px">${checkedList}</div>` : ''}
        <div class="btns">
          <button class="btn good" data-action="seer_confirm" ${state.selectedTarget?'':'disabled'}>
            ${state.selectedTarget ? '查驗 ' + nameOf(state.selectedTarget) : '請先選擇目標'}
          </button>
        </div>`;
    }
    case 'NIGHT_DOCTOR': {
      if(state.myRole !== 'DOCTOR') return `<div class="desc">🌙 天黑請閉眼…</div>`;
      const shots = d.shotsLeft ?? 0;
      const empties = d.emptyCounts || {};
      const emptyList = Object.entries(empties)
        .filter(([id, c]) => c > 0 && state.players.find(p => p.id === id && p.alive))
        .map(([id, c]) => `${nameOf(id)}：${c}/2 空針`).join('<br/>');
      return `
        <div class="title">💉 醫生施針</div>
        <div class="shoot-info">剩餘針數：<b style="color:var(--doctor)">${shots}</b></div>
        <div class="desc">點擊玩家頭像選擇施針對象（可選自己）。</div>
        ${emptyList ? `<div class="shoot-info">📋 空針紀錄：<br/>${emptyList}</div>` : ''}
        <div class="btns">
          <button class="btn doctor" data-action="doctor_heal" ${state.selectedTarget?'':'disabled'}>
            ${state.selectedTarget ? '施針給 ' + nameOf(state.selectedTarget) : '請先選擇目標'}
          </button>
          <button class="btn ghost" data-action="doctor_skip">不使用針</button>
        </div>`;
    }
    case 'NIGHT_SNIPER': {
      if(state.myRole !== 'SNIPER') return `<div class="desc">🌙 天黑請閉眼…</div>`;
      const shots = d.shotsLeft ?? 0;
      return `
        <div class="title">🎯 狙擊手開槍</div>
        <div class="shoot-info">剩餘子彈：<b style="color:var(--sniper)">${shots}</b></div>
        <div class="desc">⚠️ 子彈威力醫生無法救治，且你可能誤殺狼人！</div>
        <div class="btns">
          <button class="btn sniper" data-action="sniper_shoot" ${state.selectedTarget?'':'disabled'}>
            ${state.selectedTarget ? '狙擊 ' + nameOf(state.selectedTarget) : '請先選擇目標'}
          </button>
          <button class="btn ghost" data-action="sniper_skip">不開槍</button>
        </div>`;
    }
    case 'DAY_VOTE': {
      if(state.myVote) {
        return `<div class="desc">✅ 你已投票給 <b>${nameOf(state.myVote)}</b><br/>等待其他玩家…</div>${teammatePanel}`;
      }
      return `
        <div class="title">🗳 投票放逐</div>
        <div class="desc">點擊玩家頭像投票，最高票者將被放逐。</div>
        ${teammatePanel}
        <div class="btns">
          <button class="btn gold" data-action="vote_confirm" ${state.selectedTarget?'':'disabled'}>
            ${state.selectedTarget ? '投票給 ' + nameOf(state.selectedTarget) : '請先選擇目標'}
          </button>
          <button class="btn ghost" data-action="vote_skip">棄票</button>
        </div>`;
    }
    case 'DAY_DISCUSS':
      return `<div class="title">💬 發言階段</div><div class="desc">輪流發言，找出潛藏的邪惡方。</div>`;
    default:
      return `<div class="desc">等待中…</div>`;
  }
}

function nameOf(id){ return state.players.find(p => p.id === id)?.name || '未知'; }

function chatMsgHTML(m){
  if(m.system) return `<div class="msg system">${m.text}</div>`;
  const cls = m.channel === 'WOLF' ? 'wolf' : m.channel === 'DEAD' ? 'dead' : m.channel === 'EVIL' ? 'evil' : '';
  return `<div class="msg ${cls}"><span class="who">${m.from}：</span>${m.text}</div>`;
}

function bindActionButtons(root){
  root.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => {
      const a = btn.dataset.action;
      const t = state.selectedTarget;
      switch(a){
        case 'wolf_confirm':   socket.emit('wolf_kill',    { targetId: t }); break;
        case 'seer_confirm':   socket.emit('seer_check',   { targetId: t }); break;
        case 'doctor_heal':    socket.emit('doctor_heal',  { targetId: t }); break;
        case 'doctor_skip':    socket.emit('doctor_skip'); break;
        case 'sniper_shoot':   socket.emit('sniper_shoot', { targetId: t }); break;
        case 'sniper_skip':    socket.emit('sniper_skip'); break;
        case 'vote_confirm':   state.myVote = t; socket.emit('day_vote', { targetId: t }); break;
        case 'vote_skip':      state.myVote = null; socket.emit('day_vote', { targetId: null }); break;
      }
      state.selectedTarget = null;
    };
  });
}

let timerHandle = null;
function startTimer(el){
  clearInterval(timerHandle);
  if(!el) return;
  const tick = () => {
    if(!state.endsAt){ el.textContent = '--'; return; }
    const left = Math.max(0, Math.ceil((state.endsAt - Date.now())/1000));
    el.textContent = left;
    el.style.color = left <= 5 ? 'var(--wolf)' : 'var(--accent)';
  };
  tick();
  timerHandle = setInterval(tick, 500);
}

function GameOverModal(){
  const { winner, reason } = state.gameOver;
  const isGood = winner === 'GOOD';
  const el = document.createElement('div');
  el.className = 'lobby';
  el.style.cssText = 'position:fixed;inset:0;background:rgba(5,7,12,.9);z-index:100;overflow-y:auto;padding:20px';
  el.innerHTML = `
    <div class="lobby-card" style="text-align:center;margin:auto">
      <h1 style="color:${isGood?'var(--good)':'var(--wolf)'};font-size:22px">
        ${isGood ? '🎉 正義陣營勝利' : '👹 邪惡陣營勝利'}
      </h1>
      <p style="color:var(--muted);margin:12px 0 20px;font-size:13px">${reason}</p>
      <div style="text-align:left;font-size:13px;line-height:2">
        ${state.players.map(p => {
          const info = ROLE_INFO[p.role];
          const color = info?.camp === 'wolf' || info?.camp === 'sniper' ? 'var(--wolf)' : 'var(--good)';
          return `
            <div style="display:flex;justify-content:space-between;${p.alive?'':'opacity:.5'}">
              <span>${p.isAI?'🤖 ':''}${p.name}</span>
              <span style="color:${color}">${info?.icon || ''} ${info?.name || p.role} ${p.alive?'':'（出局）'}</span>
            </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn ghost" id="back-room">回到房間</button>
        <button class="btn" id="back-lobby">離開到大廳</button>
      </div>
    </div>
  `;
  el.querySelector('#back-room').onclick = () => {
    state.gameOver = null; state.screen = 'room'; state.phase = 'LOBBY'; render();
    socket.emit('return_to_lobby');
  };
  el.querySelector('#back-lobby').onclick = () => { state.gameOver = null; leaveRoom(); };
  return el;
}

socket.on('connect', () => { state.myId = socket.id; });

socket.on('room_created', payload => {
  state.roomId = payload.roomId; state.players = payload.players; state.phase = payload.phase;
  state.isHost = true; state.screen = 'room'; render();
});

socket.on('room_joined', payload => {
  state.roomId = payload.roomId; state.players = payload.players; state.phase = payload.phase;
  state.isHost = payload.players.find(p => p.id === state.myId)?.isHost || false;
  state.screen = 'room'; render();
});

socket.on('room_updated', payload => {
  state.players = payload.players; state.phase = payload.phase;
  state.isHost = payload.players.find(p => p.id === state.myId)?.isHost || false;
  render();
});

socket.on('players_updated', ({ players }) => { state.players = players; render(); });

socket.on('game_started', ({ myRole, players, doctorShots, sniperShots }) => {
  state.myRole = myRole; state.players = players;
  state.doctorShotsLeft = doctorShots || 0;
  state.sniperShotsLeft = sniperShots || 0;
  state.screen = 'board';
  state.chats = { PUBLIC: [], WOLF: [], EVIL: [], DEAD: [] };
   state.chatTab = myRole === 'WEREWOLF' ? 'WOLF' : myRole === 'SNIPER' ? 'EVIL' : myRole === 'SEER' ? 'POLICE' : 'PUBLIC';
  state.teammateVotes = {};
  render();
  const info = ROLE_INFO[myRole];
  alert('你的身分是：' + info.icon + ' ' + info.name + '\n\n' + info.desc);
});

socket.on('phase_changed', payload => {
  state.phase = payload.phase; state.day = payload.day;
  state.endsAt = payload.endsAt; state.phaseData = payload.data || {};
  state.myVote = null; state.selectedTarget = null;
  state.teammateVotes = payload.data?.teammateVotes || {};

  if(state.phaseData.shotsLeft !== undefined){
    if(state.myRole === 'DOCTOR') state.doctorShotsLeft = state.phaseData.shotsLeft;
    if(state.myRole === 'SNIPER') state.sniperShotsLeft = state.phaseData.shotsLeft;
  }

   if(payload.phase.startsWith('DAY') && (state.chatTab === 'WOLF' || state.chatTab === 'EVIL')) {
    state.chatTab = 'PUBLIC';
  }
  if(state.screen !== 'board') state.screen = 'board';
  render();
  if(payload.speech?.text) showJudgeBar(payload.speech.text);
});

socket.on('teammate_votes', ({ votes }) => {
  socket.on('seer_teammate_votes', ({ votes }) => {
  if(state.phaseData) state.phaseData.seerTeammateVotes = votes || {};
  render();
});
  state.teammateVotes = votes || {};
  render();
});

socket.on('vote_updated', ({ votes }) => { state.phaseData.votes = votes; render(); });

socket.on('chat_message', msg => {
  const ch = msg.channel || 'PUBLIC';
  if(!state.chats[ch]) state.chats[ch] = [];
  state.chats[ch].push(msg);
  // 🔑 只 append 訊息，不重繪整個畫面（避免輸入框被清空）
  if(state.chatTab === ch) {
    const box = document.querySelector('.chat-msgs');
    if (box) {
      box.insertAdjacentHTML('beforeend', chatMsgHTML(msg));
      box.scrollTop = box.scrollHeight;
    }
  }
});

socket.on('seer_result', ({ targetName, camp }) => {
  alert(`查驗結果：${targetName} 是 ${camp === 'WOLF' ? '🐺 壞人' : '✅ 好人'}`);
});

socket.on('game_over', ({ winner, players, reason }) => {
  state.gameOver = { winner, reason }; state.players = players; render();
});

socket.on('error_message', ({ message }) => alert(message));

function showJudgeBar(text){
  document.querySelector('.judge-bar')?.remove();
  const el = document.createElement('div');
  el.className = 'judge-bar';
  el.textContent = '🎙 ' + text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

render();
</script>
</body>
</html>
